<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TorexAI - Advanced AI Intelligence Platform</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        },
                        surface: {
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#000000'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.4); }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #404040; }

        #particle-wave-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            background-color: #000000;
        }
        
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.625; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.5rem; color: #f8fafc; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.75rem; }
    </style>
</head>
<body class="bg-black text-slate-100 font-sans antialiased h-screen flex overflow-hidden selection:bg-brand-500 selection:text-white relative">

    <!-- Simple Passcode Gate Overlay Screen -->
    <div id="auth-gate" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-3xl flex flex-col items-center justify-center p-4">
        <div class="relative max-w-sm w-full bg-neutral-900/70 border border-white/10 rounded-3xl p-8 shadow-2xl backdrop-blur-2xl text-center space-y-6">
            <div>
                <h2 class="text-2xl font-bold text-white tracking-tight">כניסה למערכת</h2>
                <p class="text-xs text-neutral-400 mt-1">אנא הזן את קוד הגישה (x1)</p>
            </div>
            <form id="auth-form" class="space-y-3.5">
                <input type="password" id="passcode-input" placeholder="הכנס קוד כניסה" class="w-full bg-neutral-800/80 border border-neutral-700/60 rounded-xl px-4 py-3 text-xs text-slate-100 text-center font-sans tracking-widest focus:outline-none">
                <p id="auth-error" class="text-xs text-red-400 hidden text-center">קוד שגוי</p>
                <button type="submit" class="w-full py-3 bg-white hover:bg-neutral-200 text-black rounded-xl text-xs font-semibold">התחבר</button>
            </form>
        </div>
    </div>

    <canvas id="particle-wave-canvas"></canvas>

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-black/75 backdrop-blur-2xl border-r border-neutral-800/80 flex flex-col justify-between shrink-0 z-30 fixed inset-y-0 left-0 md:relative md:translate-x-0 -translate-x-full transition-all">
        <div class="flex flex-col h-full">
            <div class="h-14 border-b border-neutral-800/80 px-4 flex items-center justify-between">
                <span class="font-semibold text-base text-white">TorexAI <span class="text-[10px] text-brand-400 font-mono">PRO</span></span>
            </div>
            <div class="p-3">
                <button id="new-chat-btn" class="w-full py-2.5 px-3 bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 rounded-xl text-slate-200 text-xs flex items-center justify-between">
                    <span><i class="fa-solid fa-plus text-brand-400 mr-2"></i>New Session</span>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto px-2 py-1 space-y-1" id="history-container"></div>
            <div class="p-3 border-t border-neutral-700/80 bg-black/80">
                <button id="api-key-modal-trigger" class="w-full text-left py-2 px-2.5 rounded-lg bg-neutral-900 border border-neutral-700 text-xs text-slate-300 flex items-center justify-between">
                    <span class="truncate"><i class="fa-solid fa-key text-brand-400 mr-2"></i>API Keys Config</span>
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-full min-w-0 z-10 relative">
        <header class="h-14 border-b border-neutral-700/80 px-4 flex items-center justify-between bg-black/80 backdrop-blur-xl shrink-0">
            <div class="flex items-center gap-3">
                <select id="model-select" class="bg-neutral-900 text-slate-200 border border-neutral-700 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none">
                    <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                    <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                </select>
            </div>
        </header>

        <div class="flex-1 flex flex-col min-h-0 relative">
            <!-- Messages Container -->
            <div id="messages-wrapper" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6">
                <div id="empty-state" class="max-w-2xl mx-auto py-10 flex flex-col items-center justify-center text-center my-auto min-h-[50vh]">
                    <h1 class="text-2xl sm:text-3xl font-semibold text-slate-100 mb-2">TorexAI Intelligence</h1>
                    <p class="text-sm text-slate-400">שאל אותי כל דבר למטה והתחל שיחה.</p>
                </div>
                <div id="messages-list" class="max-w-3xl mx-auto space-y-4 hidden"></div>
            </div>

            <!-- Input Box -->
            <div class="p-3 sm:p-4 border-t border-neutral-700/80 bg-black/90 shrink-0">
                <div class="max-w-3xl mx-auto relative bg-neutral-900 rounded-2xl border border-neutral-700 focus-within:border-brand-500">
                    <textarea id="chat-input" rows="1" placeholder="כתוב הודעה ל-TorexAI..." class="w-full bg-transparent text-slate-100 text-sm px-4 pt-3.5 pb-12 focus:outline-none resize-none max-h-48"></textarea>
                    <div class="absolute bottom-2.5 left-3 right-3 flex items-center justify-between">
                        <div></div>
                        <button id="send-btn" class="w-8 h-8 rounded-xl bg-brand-600 hover:bg-brand-500 text-white flex items-center justify-center transition shadow-md">
                            <i class="fa-solid fa-arrow-up text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- API Modal -->
    <div id="api-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-neutral-900 border border-neutral-700 rounded-2xl max-w-lg w-full p-6 space-y-4">
            <h3 class="text-base font-semibold text-white">הגדרת מפתח API</h3>
            <input type="password" id="api-key-input" placeholder="הדבק כאן את מפתח ה-API" class="w-full bg-black border border-neutral-700 rounded-xl px-3.5 py-2 text-xs text-slate-100 font-mono">
            <div class="flex justify-end gap-2">
                <button id="close-api-modal" class="px-4 py-2 bg-neutral-800 text-xs text-slate-300 rounded-xl">סגור</button>
                <button id="save-api-key-btn" class="px-4 py-2 bg-brand-600 text-white text-xs rounded-xl font-semibold">שמור</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Engine -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const authGate = document.getElementById('auth-gate');
            const authForm = document.getElementById('auth-form');
            const passcodeInput = document.getElementById('passcode-input');
            const authError = document.getElementById('auth-error');

            authForm.addEventListener('submit', (e) => {
                e.preventDefault();
                if (passcodeInput.value === 'x1') {
                    authGate.classList.add('hidden');
                } else {
                    authError.classList.remove('hidden');
                }
            });

            // API Modal Logic
            const apiModal = document.getElementById('api-modal');
            document.getElementById('api-key-modal-trigger').addEventListener('click', () => apiModal.classList.remove('hidden'));
            document.getElementById('close-api-modal').addEventListener('click', () => apiModal.classList.add('hidden'));

            const apiKeyInput = document.getElementById('api-key-input');
            const savedKey = localStorage.getItem('custom_api_key') || '';
            apiKeyInput.value = savedKey;

            document.getElementById('save-api-key-btn').addEventListener('click', () => {
                if(apiKeyInput.value.trim()) {
                    localStorage.setItem('custom_api_key', apiKeyInput.value.trim());
                    alert('המפתח נשמר בהצלחה!');
                    apiModal.classList.add('hidden');
                }
            });

            // Chat Functionality
            const chatInput = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');
            const emptyState = document.getElementById('empty-state');
            const messagesList = document.getElementById('messages-list');
            const modelSelect = document.getElementById('model-select');

            async function handleSendMessage() {
                const text = chatInput.value.trim();
                const apiKey = localStorage.getItem('custom_api_key');
                const selectedModel = modelSelect.value; // לוקח את הדגם הנבחר מהתפריט

                if (!text) return;
                if (!apiKey) {
                    alert('אנא הגדר מפתח API תקין דרך כפתור ההגדרות בתחתית התפריט השמאלי.');
                    apiModal.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');
                messagesList.classList.remove('hidden');

                // הוספת הודעת המשתמש למסך
                messagesList.innerHTML += `
                    <div class="flex gap-3 justify-end">
                        <div class="bg-neutral-800 text-slate-100 px-4 py-2.5 rounded-2xl max-w-xl text-sm">${escapeHtml(text)}</div>
                    </div>
                `;
                chatInput.value = '';
                messagesList.scrollTop = messagesList.scrollHeight;

                // הוספת בועת טעינה של הבוט
                const botMsgId = 'bot-msg-' + Date.now();
                messagesList.innerHTML += `
                    <div class="flex gap-3 justify-start" id="${botMsgId}">
                        <div class="bg-neutral-900 border border-neutral-700 text-slate-200 px-4 py-2.5 rounded-2xl max-w-xl text-sm">חושב...</div>
                    </div>
                `;

                try {
                    // פנייה דינמית לפי הדגם שנבחר בתפריט
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: text }] }]
                        })
                    });

                    const data = await response.json();
                    
                    if (data.error) {
                        throw new Error(data.error.message || 'שגיאה מהשרת');
                    }

                    const botReply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'לא התקבלה תשובה תקינה.';

                    document.getElementById(botMsgId).innerHTML = `
                        <div class="bg-neutral-900 border border-neutral-700 text-slate-200 px-4 py-2.5 rounded-2xl max-w-xl text-sm leading-relaxed">${marked.parse(botReply)}</div>
                    `;
                } catch (err) {
                    document.getElementById(botMsgId).innerHTML = `
                        <div class="bg-red-950 border border-red-800 text-red-200 px-4 py-2.5 rounded-2xl max-w-xl text-sm">שגיאה: ${escapeHtml(err.message)}</div>
                    `;
                }
                messagesList.scrollTop = messagesList.scrollHeight;
            }

            sendBtn.addEventListener('click', handleSendMessage);
            chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSendMessage();
                }
            });

            function escapeHtml(string) {
                return string.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }

            // Canvas background
            const canvas = document.getElementById('particle-wave-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            function animate() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                requestAnimationFrame(animate);
            }
            animate();
        });
    </script>
</body>
</html>

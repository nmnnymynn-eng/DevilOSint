<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TorexAI - Advanced AI Intelligence Platform</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        },
                        surface: {
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#000000'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Highlight.js for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <!-- Inter Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap">

    <style>
        /* Custom scrollbar for clean aesthetic */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.4);
        }
        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #404040;
        }

        /* Fullscreen Animated Background Canvas */
        #particle-wave-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            background-color: #000000;
        }
        
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.625; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.5rem; color: #f8fafc; }
        .markdown-body h1 { font-size: 1.35rem; }
        .markdown-body h2 { font-size: 1.18rem; }
        .markdown-body h3 { font-size: 1.05rem; }
        .markdown-body ul, .markdown-body ol { margin-left: 1.25rem; margin-bottom: 0.75rem; }
        .markdown-body ul { list-style-type: disc; }
        .markdown-body ol { list-style-type: decimal; }
        .markdown-body code:not(pre code) { background: rgba(38, 38, 38, 0.7); padding: 0.15rem 0.35rem; border-radius: 0.25rem; font-size: 0.875em; font-family: 'Fira Code', monospace; }
        .markdown-body pre { border-radius: 0.5rem; margin-top: 0.5rem; margin-bottom: 0.75rem; overflow-x: auto; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.8) !important; }
        .markdown-body table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        .markdown-body th, .markdown-body td { border: 1px solid #262626; padding: 0.5rem 0.75rem; text-align: left; }
        .markdown-body th { background: #0a0a0a; font-weight: 600; }
        .markdown-body blockquote { border-left: 3px solid #0ea5e9; padding-left: 1rem; color: #94a3b8; font-style: italic; margin-bottom: 0.75rem; }
    </style>
</head>
<body class="bg-black text-slate-100 font-sans antialiased h-screen flex overflow-hidden selection:bg-brand-500 selection:text-white relative">

    <!-- Simple Passcode Gate Overlay Screen -->
    <div id="auth-gate" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-3xl flex flex-col items-center justify-center p-4">
        <div class="relative max-w-sm w-full bg-neutral-900/70 border border-white/10 rounded-3xl p-8 shadow-2xl backdrop-blur-2xl text-center space-y-6 overflow-hidden">
            <div class="absolute -top-12 -right-12 w-48 h-48 bg-white/5 rounded-full blur-2xl pointer-events-none"></div>

            <div class="w-12 h-12 mx-auto rounded-full bg-neutral-800/80 border border-white/10 flex items-center justify-center shadow-inner">
                <svg class="w-6 h-6 text-white" viewBox="0 0 100 100" fill="currentColor">
                    <circle cx="50" cy="50" r="46" stroke="currentColor" stroke-width="6" fill="none" />
                    <path d="M 35 22 L 48 33 C 50 32 50 32 52 33 L 65 22 C 63 32 68 37 74 41 C 70 54 58 58 50 58 C 42 58 30 54 26 41 C 32 37 37 32 35 22 Z" fill="currentColor"/>
                    <path d="M 30 65 C 30 50 42 48 50 48 C 58 48 70 50 70 65 C 70 82 60 88 50 88 C 40 88 30 82 30 65 Z" fill="currentColor"/>
                </svg>
            </div>

            <div>
                <h2 class="text-2xl font-bold text-white tracking-tight">כניסה למערכת</h2>
                <p class="text-xs text-neutral-400 mt-1">אנא הזן את קוד הגישה שברשותך (הקוד הוא x1)</p>
            </div>

            <form id="auth-form" class="space-y-3.5">
                <div>
                    <input type="password" id="passcode-input" placeholder="הכנס קוד כניסה" class="w-full bg-neutral-800/80 border border-neutral-700/60 focus:border-white/40 rounded-xl px-4 py-3 text-xs text-slate-100 placeholder-neutral-500 focus:outline-none transition font-sans text-center text-sm tracking-widest">
                </div>

                <p id="auth-error" class="text-xs text-red-400 hidden font-medium text-center">קוד כניסה שגוי, נסה שוב</p>

                <button type="submit" id="auth-submit-btn" class="w-full py-3 bg-white hover:bg-neutral-200 text-black rounded-xl text-xs font-semibold tracking-wide transition shadow-lg">
                    התחבר
                </button>
            </form>
        </div>
    </div>

    <!-- Interactive Background Canvas -->
    <canvas id="particle-wave-canvas"></canvas>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="w-64 bg-black/75 backdrop-blur-2xl border-r border-neutral-800/80 flex flex-col justify-between shrink-0 transition-all duration-300 z-30 fixed inset-y-0 left-0 md:relative md:translate-x-0 -translate-x-full">
        <div class="flex flex-col h-full">
            <div class="h-14 border-b border-neutral-800/80 px-4 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <span class="font-semibold text-base tracking-tight text-white">TorexAI</span>
                    <span class="text-[10px] bg-brand-500/10 text-brand-400 border border-brand-500/20 px-1.5 py-0.5 rounded-full font-mono">PRO</span>
                </div>
                <button id="close-sidebar-mobile" class="md:hidden text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="p-3">
                <button id="new-chat-btn" class="w-full py-2.5 px-3 bg-neutral-900/80 hover:bg-neutral-800/90 border border-neutral-700/80 rounded-xl text-slate-200 text-xs font-medium flex items-center justify-between transition shadow-sm group">
                    <span class="flex items-center gap-2">
                        <i class="fa-solid fa-plus text-brand-400 group-hover:rotate-90 transition-transform"></i>
                        New Session
                    </span>
                    <kbd class="text-[10px] text-slate-500 bg-black px-1.5 py-0.5 rounded border border-neutral-700 font-mono">⌘N</kbd>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto px-2 py-1 space-y-1">
                <div class="px-2 py-1.5 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Recent Sessions</div>
                <div id="history-container" class="space-y-0.5"></div>
            </div>

            <div class="p-3 border-t border-neutral-700/80 bg-black/80 space-y-2">
                <button id="api-key-modal-trigger" class="w-full text-left py-2 px-2.5 rounded-lg bg-neutral-900/80 hover:bg-neutral-800/80 border border-neutral-700/80 text-xs text-slate-300 flex items-center justify-between transition">
                    <div class="flex items-center gap-2 truncate">
                        <i class="fa-solid fa-key text-brand-400 text-xs"></i>
                        <span id="api-status-text" class="truncate">API Keys & Models Config</span>
                    </div>
                    <span id="api-status-badge" class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content Container -->
    <div class="flex-1 flex flex-col h-full min-w-0 bg-transparent z-10 relative">
        <header class="h-14 border-b border-neutral-700/80 px-4 flex items-center justify-between bg-black/80 backdrop-blur-xl shrink-0 z-10">
            <div class="flex items-center gap-3">
                <button id="toggle-sidebar-btn" class="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-neutral-900 border border-neutral-700/60 transition">
                    <i class="fa-solid fa-bars text-sm"></i>
                </button>
                <div class="h-4 w-[1px] bg-neutral-700"></div>

                <div class="relative">
                    <select id="model-select" class="bg-neutral-900 text-slate-200 border border-neutral-700 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-brand-500 cursor-pointer pr-7 appearance-none font-medium shadow-md">
                        <optgroup label="Google AI Engines">
                            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                            <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                        </optgroup>
                        <optgroup label="OpenAI Engines">
                            <option value="gpt-4o">GPT-4o Omni</option>
                        </optgroup>
                    </select>
                    <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button id="clear-chat-btn" class="p-2 text-slate-400 hover:text-red-400 hover:bg-neutral-900 border border-neutral-700/60 rounded-lg transition" title="Clear Chat">
                    <i class="fa-solid fa-trash-can text-xs"></i>
                </button>
            </div>
        </header>

        <div class="flex-1 flex min-h-0 relative">
            <div id="chat-container" class="flex-1 flex flex-col h-full min-w-0 transition-all duration-300 bg-transparent">
                <div id="messages-wrapper" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6">
                    <div id="empty-state" class="max-w-2xl mx-auto py-10 px-4 flex flex-col items-center justify-center text-center my-auto min-h-[60vh]">
                        <h1 class="text-2xl sm:text-3xl font-semibold text-slate-100 tracking-tight mb-2">TorexAI Multi-Engine Intelligence</h1>
                        <p class="text-sm text-slate-300 mb-8 max-w-md">Unified access to AI models with custom workspace.</p>
                    </div>

                    <div id="messages-list" class="max-w-3xl mx-auto space-y-6 hidden"></div>
                </div>

                <div class="p-3 sm:p-4 border-t border-neutral-700/80 bg-black/90 backdrop-blur-2xl shrink-0">
                    <div class="max-w-3xl mx-auto">
                        <div class="relative bg-neutral-900/90 backdrop-blur-xl rounded-2xl border border-neutral-700 focus-within:border-brand-500 transition shadow-2xl">
                            <textarea id="chat-input" rows="1" placeholder="Ask TorexAI..." class="w-full bg-transparent text-slate-100 text-sm placeholder-slate-400 px-4 pt-3.5 pb-12 focus:outline-none resize-none max-h-48"></textarea>

                            <div class="absolute bottom-2.5 left-3 right-3 flex items-center justify-between">
                                <div class="flex items-center gap-1.5"></div>
                                <div class="flex items-center gap-2">
                                    <button id="send-btn" class="w-8 h-8 rounded-xl bg-brand-600 hover:bg-brand-500 text-white flex items-center justify-center transition shadow-md">
                                        <i class="fa-solid fa-arrow-up text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- API Key Modal -->
    <div id="api-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-neutral-900 border border-neutral-700/80 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-neutral-800 pb-3">
                <h3 class="text-base font-semibold text-white">API Keys Configuration</h3>
                <button id="close-api-modal" class="text-slate-400 hover:text-white p-1.5 rounded-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3">
                <input type="password" id="api-key-input" placeholder="הדבק כאן את מפתח ה-API שלך (למשל Gemini Key)" class="w-full bg-black border border-neutral-700 rounded-xl px-3.5 py-2 text-xs text-slate-100 font-mono">
            </div>
            <div class="flex justify-end pt-2">
                <button id="save-api-key-btn" class="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-xs font-semibold">שמור הגדרות</button>
            </div>
        </div>
    </div>

    <!-- Application JavaScript Engine -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Passcode Gate Logic
            const authGate = document.getElementById('auth-gate');
            const authForm = document.getElementById('auth-form');
            const passcodeInput = document.getElementById('passcode-input');
            const authError = document.getElementById('auth-error');

            authForm.addEventListener('submit', (e) => {
                e.preventDefault();
                if (passcodeInput.value === 'x1') {
                    authGate.classList.add('hidden');
                } else {
                    authError.classList.remove('hidden');
                }
            });

            // Modal Controls
            const apiModal = document.getElementById('api-modal');
            document.getElementById('api-key-modal-trigger').addEventListener('click', () => apiModal.classList.remove('hidden'));
            document.getElementById('close-api-modal').addEventListener('click', () => apiModal.classList.add('hidden'));

            document.getElementById('save-api-key-btn').addEventListener('click', () => {
                const userKey = document.getElementById('api-key-input').value;
                if(userKey) {
                    localStorage.setItem('custom_api_key', userKey);
                    alert('המפתח נשמר בהצלחה בדפדפן!');
                    apiModal.classList.add('hidden');
                }
            });

            // Background Canvas Animation
            const canvas = document.getElementById('particle-wave-canvas');
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            function animate() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(0, 0, width, height);
                requestAnimationFrame(animate);
            }
            animate();
        });
    </script>
</body>
</html>
